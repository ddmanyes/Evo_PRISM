<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="evo-request-loop-title evo-request-loop-desc">
  <title id="evo-request-loop-title">Evo_PRISM request-to-memory loop</title>
  <desc id="evo-request-loop-desc">A user request passes through routing and the L1 semantic cache before HELIX tool discovery and execution. Source data flows from L3 to L2, while completed artifacts enter ENGRAM and feed future cache reuse.</desc>
  <defs>
    <marker id="evo-request-loop-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4f5d75"/>
    </marker>
    <marker id="evo-request-loop-arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2e5aa8"/>
    </marker>
    <marker id="evo-request-loop-arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#eb6c36"/>
    </marker>
  </defs>
  <style>
    .title { font: 600 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .subtitle { font: 400 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
    .lane { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.5px; fill: #64748b; }
    .node-title { font: 600 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .node-copy { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    .node-mono { font: 500 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
    .edge-label { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
    .step { font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ffffff; }
    .edge { fill: none; stroke: #4f5d75; stroke-width: 2; marker-end: url(#evo-request-loop-arrow); }
    .edge-blue { fill: none; stroke: #2e5aa8; stroke-width: 2.2; marker-end: url(#evo-request-loop-arrow-blue); }
    .edge-orange { fill: none; stroke: #eb6c36; stroke-width: 2.2; marker-end: url(#evo-request-loop-arrow-orange); }
    .feedback { fill: none; stroke: #2e5aa8; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#evo-request-loop-arrow-blue); }
  </style>

  <rect width="1440" height="810" fill="#ffffff"/>
  <text x="48" y="54" class="title">Evo_PRISM — Request-to-Memory Loop</text>
  <text x="48" y="82" class="subtitle">Reuse first · execute only on a miss · preserve every result with provenance</text>

  <rect x="40" y="108" width="1360" height="388" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="64" y="137" class="lane">CONTROL PLANE</text>
  <rect x="40" y="518" width="1360" height="242" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="64" y="547" class="lane">DATA &amp; MEMORY PLANE</text>

  <!-- Connections are intentionally drawn before nodes. -->
  <path class="edge" d="M246 214 H350"/>
  <path class="edge-orange" d="M590 214 H700"/>
  <path class="edge-blue" d="M940 214 H1130"/>
  <path class="edge-orange" d="M820 270 V344"/>
  <path class="edge" d="M940 414 H1060"/>
  <path class="edge-blue" d="M1190 354 V270"/>
  <path class="edge" d="M330 628 H440"/>
  <path class="edge" d="M690 628 H900 V414 H1060"/>
  <path class="edge-blue" d="M1190 484 V566"/>
  <path class="feedback" d="M1340 628 H1380 V304 H820 V270"/>

  <!-- Connector labels use open-space capsules. -->
  <rect x="261" y="194" width="74" height="25" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="298" y="211" text-anchor="middle" class="edge-label">normalize</text>
  <rect x="607" y="194" width="76" height="25" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="645" y="211" text-anchor="middle" class="edge-label">reuse</text>
  <rect x="987" y="194" width="92" height="25" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1033" y="211" text-anchor="middle" class="edge-label">cache hit</text>
  <rect x="836" y="294" width="60" height="25" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="866" y="311" text-anchor="middle" class="edge-label">miss</text>
  <rect x="963" y="394" width="74" height="25" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="1000" y="411" text-anchor="middle" class="edge-label">approved</text>
  <rect x="346" y="608" width="80" height="25" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="386" y="625" text-anchor="middle" class="edge-label">transform</text>
  <rect x="749" y="608" width="74" height="25" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="786" y="625" text-anchor="middle" class="edge-label">features</text>
  <rect x="1206" y="514" width="72" height="25" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1242" y="531" text-anchor="middle" class="edge-label">archive</text>
  <rect x="1086" y="284" width="116" height="25" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1144" y="301" text-anchor="middle" class="edge-label">index + cache</text>

  <!-- Control-plane nodes. -->
  <rect x="56" y="158" width="190" height="112" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="84" cy="185" r="15" fill="#4f5d75"/>
  <text x="84" y="190" text-anchor="middle" class="step">1</text>
  <text x="108" y="190" class="node-title">User request</text>
  <text x="80" y="226" class="node-copy">Natural language</text>
  <text x="80" y="247" class="node-copy">or API call</text>

  <rect x="350" y="158" width="240" height="112" rx="16" fill="#fff7ed" stroke="#eb6c36" stroke-width="2.4"/>
  <circle cx="380" cy="185" r="15" fill="#eb6c36"/>
  <text x="380" y="190" text-anchor="middle" class="step">2</text>
  <text x="404" y="190" class="node-title">Reuse router</text>
  <text x="378" y="226" class="node-copy">Exact and history checks</text>
  <text x="378" y="247" class="node-copy">before new computation</text>

  <rect x="700" y="158" width="240" height="112" rx="16" fill="#eff6ff" stroke="#2e5aa8" stroke-width="2.4"/>
  <circle cx="730" cy="185" r="15" fill="#2e5aa8"/>
  <text x="730" y="190" text-anchor="middle" class="step">3</text>
  <text x="754" y="190" class="node-title">L1 semantic cache</text>
  <text x="728" y="226" class="node-copy">4-way RRF when context exists</text>
  <text x="728" y="247" class="node-mono">cosine · BM25 · fingerprint · context</text>

  <rect x="1130" y="158" width="230" height="112" rx="16" fill="#eff6ff" stroke="#2e5aa8" stroke-width="2.4"/>
  <circle cx="1160" cy="185" r="15" fill="#2e5aa8"/>
  <text x="1160" y="190" text-anchor="middle" class="step">6</text>
  <text x="1184" y="190" class="node-title">Return result</text>
  <text x="1158" y="226" class="node-copy">Cached or newly executed</text>
  <text x="1158" y="247" class="node-copy">with provenance attached</text>

  <rect x="660" y="344" width="280" height="140" rx="16" fill="#fff7ed" stroke="#eb6c36" stroke-width="2.4"/>
  <circle cx="692" cy="374" r="15" fill="#eb6c36"/>
  <text x="692" y="379" text-anchor="middle" class="step">4</text>
  <text x="718" y="379" class="node-title">HELIX discovery</text>
  <text x="690" y="414" class="node-copy">Search registered tools</text>
  <text x="690" y="436" class="node-copy">Sandbox only on a miss</text>
  <text x="690" y="458" class="node-copy">Human-gated promotion</text>

  <rect x="1060" y="354" width="260" height="130" rx="16" fill="#ffffff" stroke="#2e5aa8" stroke-width="2.4"/>
  <circle cx="1092" cy="384" r="15" fill="#2e5aa8"/>
  <text x="1092" y="389" text-anchor="middle" class="step">5</text>
  <text x="1118" y="389" class="node-title">Execute analysis</text>
  <text x="1090" y="425" class="node-copy">Registered or approved code</text>
  <text x="1090" y="447" class="node-copy">runs against L2 features</text>

  <!-- Data and memory nodes. -->
  <rect x="80" y="574" width="250" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="106" y="609" class="node-title">L3 · Source data</text>
  <text x="106" y="638" class="node-copy">Immutable raw inputs</text>
  <text x="106" y="660" class="node-mono">FASTQ · images · vendor output</text>

  <rect x="440" y="574" width="250" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="466" y="609" class="node-title">L2 · Feature store</text>
  <text x="466" y="638" class="node-copy">Structured, reusable features</text>
  <text x="466" y="660" class="node-mono">DuckDB tables · Parquet</text>

  <rect x="1040" y="566" width="300" height="124" rx="16" fill="#eff6ff" stroke="#2e5aa8" stroke-width="2.4"/>
  <text x="1068" y="604" class="node-title">ENGRAM memory</text>
  <text x="1068" y="635" class="node-copy">Artifacts + analysis history</text>
  <text x="1068" y="658" class="node-copy">linked to HELIX tool versions</text>
  <text x="1068" y="679" class="node-mono">searchable · reusable · traceable</text>

  <rect x="54" y="715" width="14" height="14" rx="3" fill="#eb6c36"/>
  <text x="78" y="727" class="node-copy">Control decision</text>
  <rect x="226" y="715" width="14" height="14" rx="3" fill="#2e5aa8"/>
  <text x="250" y="727" class="node-copy">Memory or delivery</text>
  <path d="M427 722 H463" class="feedback"/>
  <text x="476" y="727" class="node-copy">Feedback into future reuse</text>
</svg>
