<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="ep-title ep-desc"><title id="ep-title">EP 現況總覽</title><desc id="ep-desc">Agent calls EP. EP returns results and uses HELIX and ENGRAM. Optional Clef shadow advises without execution authority. L1 cache is separate from permanent artifacts.</desc><defs><marker id="ep-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker></defs><rect width="1280" height="650" fill="#fff"/><g font-family="system-ui, -apple-system, PingFang TC, sans-serif"><text x="640" y="42" text-anchor="middle" font-size="28" fill="#2d3142" font-weight="600">EP 現況總覽</text><text x="640" y="72" text-anchor="middle" font-size="15" fill="#2d3142" font-weight="400">2026-10-12 · 程式能力總覽；部署需另行設定</text><path d="M370 190 H470" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#ep-arrow)"/><path d="M810 190 H910" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#ep-arrow)"/><path d="M640 250 V310" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#ep-arrow)" stroke-dasharray="7 5" marker-start="url(#ep-arrow)"/><path d="M520 250 V280 H200 V445" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#ep-arrow)"/><path d="M760 250 V280 H1080 V445" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#ep-arrow)"/><rect x="30" y="130" width="340" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="200" y="175" text-anchor="middle" font-size="21" fill="#2d3142" font-weight="600">Agent／MCP 客戶端</text><text x="200" y="210" text-anchor="middle" font-size="16" fill="#2d3142" font-weight="400">需求、規劃、結果解讀</text><rect x="470" y="130" width="340" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="640" y="175" text-anchor="middle" font-size="21" fill="#2d3142" font-weight="600">EP 工具入口</text><text x="640" y="210" text-anchor="middle" font-size="16" fill="#2d3142" font-weight="400">權限檢查、查詢與分析</text><rect x="910" y="130" width="340" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="1080" y="175" text-anchor="middle" font-size="21" fill="#2d3142" font-weight="600">結果與來源</text><text x="1080" y="210" text-anchor="middle" font-size="16" fill="#2d3142" font-weight="400">報告、圖片、資料</text><rect x="470" y="310" width="340" height="120" rx="12" fill="#fff7ed" stroke="#eb6c36"/><text x="640" y="355" text-anchor="middle" font-size="21" fill="#2d3142" font-weight="600">Clef shadow（可選）</text><text x="640" y="390" text-anchor="middle" font-size="16" fill="#2d3142" font-weight="400">規則主導；只提供比較建議</text><rect x="30" y="445" width="340" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="200" y="490" text-anchor="middle" font-size="21" fill="#2d3142" font-weight="600">HELIX</text><text x="200" y="525" text-anchor="middle" font-size="16" fill="#2d3142" font-weight="400">工具搜尋、版本與人工升格</text><rect x="910" y="445" width="340" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="1080" y="490" text-anchor="middle" font-size="21" fill="#2d3142" font-weight="600">ENGRAM</text><text x="1080" y="525" text-anchor="middle" font-size="16" fill="#2d3142" font-weight="400">已登記產物、檢索與來源</text><text x="640" y="480" text-anchor="middle" font-size="19" fill="#2d3142" font-weight="600">資料分層</text><text x="640" y="514" text-anchor="middle" font-size="17" fill="#2d3142" font-weight="400">L3 Raw → L2 Features → L1 Cache</text><text x="640" y="548" text-anchor="middle" font-size="14" fill="#2d3142" font-weight="400">L1 可過期；永久產物由 ENGRAM 管理</text><text x="640" y="616" text-anchor="middle" font-size="16" fill="#2d3142" font-weight="400">虛線：可選建議；Clef 不直接執行工具或批准升格</text></g></svg>
