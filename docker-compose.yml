# Evo_PRISM — Docker Compose (macOS host deployment, 2026-07-15)
# ─────────────────────────────────────────────────────────────────────────────
# Scope on this machine: the bio-memory MCP tool surface (36 tools currently
# registered — history/memory/artifact/analysis/tool-health), no local LLM
# needed for the core memory tools. Matches the lcdda / second-brain pattern:
#   - persistent (restart: unless-stopped)
#   - bound to this Mac's Tailscale IP only (not 0.0.0.0) on the host side
#   - MCP_AUTH_TOKEN bearer-auth required (see .env)
#   - embedding reuses the shared bge-m3 llama-server (host:8081, 1024-dim) that
#     sb/lcdda also point at via host.docker.internal — no separate sidecar needed.
#     (2026-09-03: this used to point at lcdda's now-retired nomic-embed-text on
#     :11435/768d; sb+lcdda migrated to bge-m3:8081/1024d and this config drifted
#     out of sync with them until fixed here — see second-brain's Phase B-0 plan.)
#
# Local LLM/vision inference reuses lcdda's already-running Gemma4-12B (llama-server
# on host:11434, launched WITH --mmproj so it's vision-capable) instead of standing
# up a separate local Gemma4 Vision 26B — same substitution as the embedding above.
# agent.py's LLAMA_BASE_URL/LLAMA_MODEL were hardcoded to localhost:8080; patched to
# read from env (see server/agent.py) to allow this.
#
# Real data (2026-07-15): the project root already holds the actual research DB +
# results (bio_memory.duckdb: 126 samples / 269 analyses at schema v23; gold/
# silver/results/bulk_rna_data), predating this Docker setup. Bind-mounted directly
# rather than using a Docker-managed volume, so the container reads/writes the
# SAME files already on disk — no import/copy step, no second copy of 88GB of
# results. bio_memory.duckdb.bak-2026-07-16 / hermes_cache.duckdb.bak-2026-07-16
# backups of the pre-migration state live in ~/evo_prism_backups/ on the host.
#
# Commands:
#   docker compose up -d --build  # core mode; KINGSTON only
#   docker compose -f docker-compose.yml -f docker-compose.ssd.yml up -d
#                                  # SSD mode; opt-in raw L3 access for MCseg
#   docker compose logs -f evo-prism
#   docker compose down
# ─────────────────────────────────────────────────────────────────────────────
services:
  evo-prism:
    build: &evo-build
      # NOT `.` (KINGSTON/exFAT) — BuildKit's context "sender" fails reading AppleDouble
      # (._*) xattrs on exFAT ("failed to xattr ...: operation not permitted"), and BuildKit
      # is required for --platform (the legacy DOCKER_BUILDKIT=0 builder silently ignores
      # `platform:` and always builds native arch, which was masking the real fix for a
      # while). Source is mirrored to APFS via:
      #   rsync -a --delete --exclude-from=.dockerignore ... ~/evo_prism_build/
      # re-run that after editing files here, before rebuilding.
      context: /Users/lab_center/evo_prism_build
      dockerfile: Dockerfile
    platform: linux/amd64   # scikit-misc (omicverse dep) has no linux/arm64 wheel on PyPI, only
                             # macOS arm64 + linux x86_64 — native arm64 build falls back to a
                             # broken source build (meson version_please.py fails). Runs under
                             # Rosetta emulation on Apple Silicon Docker Desktop; slower but correct.
    restart: unless-stopped
    command: ["web"]   # entrypoint.sh: uvicorn server.web_app:app (mounts /mcp), not the stdio-default "server" mode
    env_file: .env
    environment: &evo-environment
      BIO_DB_ROOT: /data/bio_db
      # Pre-existing bug found 2026-07-16: config/settings.py's MSSEG_PATH default
      # ("K:/plan_a/MSseg", a Windows path) doesn't exist in this container even
      # though the real MSseg/ tree is baked into the image at /app/MSseg — mcseg
      # tools would fail on import before this was set. Never previously exercised
      # end-to-end in this deployment (see evo-prism-mcp-遠端部署-docker-2026-07-15,
      # "MCseg 尚未端到端測試").
      MSSEG_PATH: /app/MSseg
      EMBEDDING_PROVIDER: llamacpp
      LLAMACPP_BASE_URL: http://host.docker.internal:8081/v1
      EMBEDDING_MODEL: bge-m3-Q8_0
      EMBEDDING_DIM: "1024"
      INFERENCE_BACKEND: local
      LLAMA_BASE_URL: http://host.docker.internal:11434/v1
      LLAMA_MODEL: gemma
      LLAMA_NO_THINK: "1"
    extra_hosts: &evo-extra-hosts
      - "host.docker.internal:host-gateway"
    volumes: &evo-volumes
      - ./bio_memory.duckdb:/data/bio_db/bio_memory.duckdb
      - ./gold:/data/bio_db/gold
      - ./silver:/data/bio_db/silver
      - ./results:/data/bio_db/results
      - ./bulk_rna_data:/data/bio_db/bulk_rna_data
      - ./logs:/data/bio_db/logs
      # mcseg host-native GPU dispatch job queue (see analysis/mcseg_wrapper.py +
      # scripts/mcseg_host_watcher.py) — small control-plane JSON files only, no
      # image data crosses this mount, the actual he_crop/mask files already live
      # under ./results (mounted above) and are shared with the host as-is.
      - ./mcseg_jobs:/data/bio_db/mcseg_jobs
      # MSseg runtime code is synchronized from its standalone SSD repository into
      # KINGSTON before deployment. Mount only the backend package (never a host
      # venv) so the container uses its own Linux dependencies with the synchronized
      # Python implementation. Read-only prevents container-side source drift.
      - ./MSseg/backend:/app/MSseg/backend:ro
      # Raw L3 data on /Volumes/SSD is intentionally not a core dependency.
      # Opt in with docker-compose.ssd.yml only while SSD-backed MCseg inputs are
      # needed; the default service must remain restartable with that drive absent.
      # Analysis playbooks (2026-07-23): playbooks/*.md already existed on disk
      # (bulk_rnaseq, mcseg, spatial_visium, visium_hd_onboarding) but were never
      # mounted, so bio_get_playbook always reported "playbooks/ 為空" even though
      # real content was sitting right here the whole time.
      - ./playbooks:/data/bio_db/playbooks
    ports:
      - "100.87.59.15:8000:8000"   # Tailscale-only, matches lcdda(:9104)/second-brain(:9100) binding pattern
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  analysis-worker-cpu:
    build: *evo-build
    platform: linux/amd64
    restart: unless-stopped
    command: ["worker", "cpu"]
    env_file: .env
    environment: *evo-environment
    extra_hosts: *evo-extra-hosts
    volumes: *evo-volumes
    depends_on:
      evo-prism:
        condition: service_healthy

  analysis-worker-gpu:
    build: *evo-build
    platform: linux/amd64
    restart: unless-stopped
    command: ["worker", "gpu"]
    env_file: .env
    environment: *evo-environment
    extra_hosts: *evo-extra-hosts
    volumes: *evo-volumes
    depends_on:
      evo-prism:
        condition: service_healthy
